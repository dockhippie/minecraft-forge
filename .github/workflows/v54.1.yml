---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: v54.1

"on":
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - v54.1/*
      - .github/workflows/v54.1.yml
  pull_request:
    branches:
      - master
    paths:
      - v54.1/*
      - .github/workflows/v54.1.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          images: |
            webhippie/minecraft-forge
            quay.io/webhippie/minecraft-forge
            ghcr.io/dockhippie/minecraft-forge
          labels: |
            org.opencontainers.image.vendor=Webhippie
            maintainer=Thomas Boerger <thomas@webhippie.de>

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Hub login
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Quay login
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Ghcr login
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: v54.1/
          provenance: false
          file: v54.1/Dockerfile.${{ matrix.variant.arch }}
          platforms: ${{ matrix.variant.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            webhippie/minecraft-forge:54.1-${{ matrix.variant.arch }}
            quay.io/webhippie/minecraft-forge:54.1-${{ matrix.variant.arch }}
            ghcr.io/dockhippie/minecraft-forge:54.1-${{ matrix.variant.arch }}

  manifest:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    needs:
      - docker

    steps:
      - name: Hub login
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Quay login
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Ghcr login
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push manifests
        run: |
          repos=("webhippie/minecraft-forge:54.1" "quay.io/webhippie/minecraft-forge:54.1" "ghcr.io/dockhippie/minecraft-forge:54.1")
          archs=("amd64" "arm64")

          retry() {
            local max=5 delay=10
            for i in $(seq 1 $max); do
              "$@" && return 0
              echo "Attempt $i failed. Retrying in ${delay}s..."
              sleep $delay
              delay=$(( delay * 2 ))
            done
            return 1
          }

          for arch in "${archs[@]}"; do
            for repo in "${repos[@]}"; do
              echo "Checking ${repo}-${arch}..."
              if ! retry docker manifest inspect "${repo}-${arch}" > /dev/null 2>&1; then
                echo "::error ::Image ${repo}-${arch} is missing"
                exit 1
              fi
              echo "${repo}-${arch} does exist"
            done
          done

          for repo in "${repos[@]}"; do
            args=()
            for arch in "${archs[@]}"; do
              args+=(--amend "${repo}-${arch}")
            done
            docker manifest create "$repo" "${args[@]}"
            docker manifest push "$repo"
          done

...
